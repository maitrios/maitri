[Service]
# Dev trees (node_modules, build output, docker layers) make a full index run for
# minutes and use gigabytes, so prune them and run at idle priority.
Nice=19
IOSchedulingClass=idle
ExecStart=
ExecStart=/usr/bin/updatedb --prune-bind-mounts=no --add-prunepaths="/.snapshots /var/lib/docker" --add-prunenames="node_modules .venv target .next .turbo .cache"
