name: Leak gate

# Fails a PR, or a push to main, that carries one of the forbidden names. The
# LEAK_PATTERN secret holds them; tools/leak-gate.sh checks the added lines,
# new file names, commit messages, title, body and branch, and prints only
# where something matched. test/shell.d/leak-gate-test.sh covers it with a
# dummy pattern. A missing secret fails, except on a fork's PR (below).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leak-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # History without blobs; the diff fetches only the ones it reads.
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools/leak-gate.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check for the forbidden names
        env:
          LEAK_PATTERN: ${{ secrets.LEAK_PATTERN }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          # A fork's PR never sees secrets, and failing every outside contributor's PR would be noise; agents push same-repo branches.
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          args=()
          if [[ $FORK == "true" ]]; then
            args+=(--fork)
          fi
          tools/leak-gate.sh "${args[@]}" "$BASE" "$HEAD"
