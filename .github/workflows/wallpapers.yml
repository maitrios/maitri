name: Wallpapers

# Publishes the wallpapers attached to a release as wallpapers.tar, and points
# the stable manifest that `maitri update` installs from at that release. A
# release without the tar carries the current wallpapers forward. Runs on the
# published release rather than the tag push: RELEASING.md pushes the tag
# before the packages reach stable, and the wallpapers should land with them.
# The release environment only takes v* tags, so a manual run has to be
# started on the tag (--ref vX.Y.Z). See docs/wallpapers.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to publish wallpapers for; start the run on the same tag
        required: true
      dry_run:
        description: Only report what would be uploaded
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wallpapers
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that is not on main
        run: |
          [[ $GITHUB_REF == "refs/tags/$TAG" ]] || { echo "Start the run on $TAG itself (--ref $TAG), not $GITHUB_REF" >&2; exit 1; }
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          [[ $commit == "$GITHUB_SHA" ]] || { echo "$TAG is at $commit, but this run is for $GITHUB_SHA" >&2; exit 1; }
          git merge-base --is-ancestor "$commit" HEAD || { echo "$TAG is not on main" >&2; exit 1; }

      - name: Fetch the release's wallpapers
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets)
          echo "prerelease=$(jq -r '.isPrerelease' <<<"$release")" >>"$GITHUB_OUTPUT"
          size=$(jq -r '[.assets[] | select(.name == "wallpapers.tar") | .size] | first // empty' <<<"$release")
          if [[ -z $size ]]; then
            echo "$TAG has no wallpapers.tar; carrying the current wallpapers forward"
            exit 0
          fi
          (( size <= 1073741824 )) || { echo "wallpapers.tar is $size bytes, over the 1 GiB limit" >&2; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern wallpapers.tar --dir "$RUNNER_TEMP"
          echo "tar=$RUNNER_TEMP/wallpapers.tar" >>"$GITHUB_OUTPUT"

      - name: Publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PRERELEASE: ${{ steps.release.outputs.prerelease == 'true' && '1' || '' }}
          WALLPAPERS_TAR: ${{ steps.release.outputs.tar }}
        run: tools/wallpapers-upload.sh ${DRY_RUN:+--dry-run} ${PRERELEASE:+--prerelease} ${WALLPAPERS_TAR:+--tar "$WALLPAPERS_TAR"} "$TAG"
